openapi: 3.0.0
servers:
  - url: https://itunes.apple.com
info:
  title: iTunes Search API
  version: v2
  description: iTunes / Apple Search API for searching media in the iTunes Store and Apple Books.
components:
  schemas:
    ErrorBody:
      type: object
      required: [ errorMessage ]
      properties:
        errorMessage:
          type: string
          description: Human-readable error detail
        queryParameters:
          $ref: '#/components/schemas/QueryParameters'
    QueryParameters:
      type: object
      additionalProperties:
        type: string
      properties:
        output:
          type: string
          example: json
        callback:
          type: string
          example: A javascript function to handle your search results
        country:
          type: string
          description: ISO-2A country code
          example: US
          minLength: 2
          maxLength: 2
        limit:
          type: string
          description: The number of search results to return
          example: '20'
        term:
          type: string
          description: A search string
          example: Breaking+Bad
        lang:
          type: string
          description: ISO-2A language code
          example: en
paths:
  /search:
    get:
      operationId: search
      summary: Search the iTunes Store and Apple Books
      parameters:
        - name: term
          in: query
          required: true
          description: The URL-encoded text string to search for. Example `jack+johnson`.
          schema:
            type: string

        - name: country
          in: query
          required: true
          description: >
            Two-letter ISO 3166-1 alpha-2 country code. Defaults to `US`.
          schema:
            type: string
            minLength: 2
            maxLength: 2
          example: US

        - name: media
          in: query
          required: false
          description: Media type to search. Defaults to `all`.
          schema:
            type: string
            enum: [movie, podcast, music, musicVideo, audiobook, shortFilm, tvShow, software, ebook, all]
          example: music

        - name: entity
          in: query
          required: false
          description: >
            Entity type relative to the selected media. Defaults to the track entity associated with the media.
          schema:
            type: string

        - name: attribute
          in: query
          required: false
          description: >
            Attribute to search against relative to the selected media.
          schema:
            type: string

        - name: limit
          in: query
          required: false
          description: Number of results to return (1–200). Default is 50.
          schema:
            type: integer
            minimum: 1
            maximum: 200
          example: 25

        - name: lang
          in: query
          required: false
          description: >
            Language for the result text. Use the five-letter code. Default is `en_us`.
          schema:
            type: string
            enum: [en_us, ja_jp]
          example: en_us

        - name: explicit
          in: query
          required: false
          description: Whether to include explicit content. Default is `Yes`.
          schema:
            type: string
            enum: [Yes, No]
          example: Yes

      x-dependencies:
        - IF entity THEN media;
        - IF attribute THEN media;

        # entity constraints by media
        - IF media=='movie' THEN (entity=='movieArtist' OR entity=='movie');
        - IF media=='podcast' THEN (entity=='podcastAuthor' OR entity=='podcast');
        - IF media=='music' THEN (entity=='musicArtist' OR entity=='musicTrack' OR entity=='album' OR entity=='musicVideo' OR entity=='mix' OR entity=='song');
        - IF media=='musicVideo' THEN (entity=='musicArtist' OR entity=='musicVideo');
        - IF media=='audiobook' THEN (entity=='audiobookAuthor' OR entity=='audiobook');
        - IF media=='shortFilm' THEN (entity=='shortFilmArtist' OR entity=='shortFilm');
        - IF media=='tvShow' THEN (entity=='tvEpisode' OR entity=='tvSeason');
        - IF media=='software' THEN (entity=='software' OR entity=='iPadSoftware' OR entity=='macSoftware');
        - IF media=='ebook' THEN (entity=='ebook');
        - IF media=='all' THEN (entity=='movie' OR entity=='album' OR entity=='allArtist' OR entity=='podcast' OR entity=='musicVideo' OR entity=='mix' OR entity=='audiobook' OR entity=='tvSeason' OR entity=='allTrack');

        # attribute constraints by media
        - IF media=='movie' THEN (attribute=='actorTerm' OR attribute=='genreIndex' OR attribute=='artistTerm' OR attribute=='shortFilmTerm' OR attribute=='producerTerm' OR attribute=='ratingTerm' OR attribute=='directorTerm' OR attribute=='releaseYearTerm' OR attribute=='featureFilmTerm' OR attribute=='movieArtistTerm' OR attribute=='movieTerm' OR attribute=='ratingIndex' OR attribute=='descriptionTerm');
        - IF media=='podcast' THEN (attribute=='titleTerm' OR attribute=='languageTerm' OR attribute=='authorTerm' OR attribute=='genreIndex' OR attribute=='artistTerm' OR attribute=='ratingIndex' OR attribute=='keywordsTerm' OR attribute=='descriptionTerm');
        - IF media=='music' THEN (attribute=='mixTerm' OR attribute=='genreIndex' OR attribute=='artistTerm' OR attribute=='composerTerm' OR attribute=='albumTerm' OR attribute=='ratingIndex' OR attribute=='songTerm');
        - IF media=='musicVideo' THEN (attribute=='genreIndex' OR attribute=='artistTerm' OR attribute=='albumTerm' OR attribute=='ratingIndex' OR attribute=='songTerm');
        - IF media=='audiobook' THEN (attribute=='titleTerm' OR attribute=='authorTerm' OR attribute=='genreIndex' OR attribute=='ratingIndex');
        - IF media=='shortFilm' THEN (attribute=='genreIndex' OR attribute=='artistTerm' OR attribute=='shortFilmTerm' OR attribute=='ratingIndex' OR attribute=='descriptionTerm');
        - IF media=='software' THEN (attribute=='softwareDeveloper');
        - IF media=='tvShow' THEN (attribute=='genreIndex' OR attribute=='tvEpisodeTerm' OR attribute=='showTerm' OR attribute=='tvSeasonTerm' OR attribute=='ratingIndex' OR attribute=='descriptionTerm');
        - IF media=='all' THEN (attribute=='actorTerm' OR attribute=='languageTerm' OR attribute=='allArtistTerm' OR attribute=='tvEpisodeTerm' OR attribute=='shortFilmTerm' OR attribute=='directorTerm' OR attribute=='releaseYearTerm' OR attribute=='titleTerm' OR attribute=='featureFilmTerm' OR attribute=='ratingIndex' OR attribute=='keywordsTerm' OR attribute=='descriptionTerm' OR attribute=='authorTerm' OR attribute=='genreIndex' OR attribute=='mixTerm' OR attribute=='allTrackTerm' OR attribute=='artistTerm' OR attribute=='composerTerm' OR attribute=='tvSeasonTerm' OR attribute=='producerTerm' OR attribute=='ratingTerm' OR attribute=='songTerm' OR attribute=='movieArtistTerm' OR attribute=='showTerm' OR attribute=='movieTerm' OR attribute=='albumTerm');

      responses:
        '200':
          description: Successful response
          content:
#            application/json:
            text/javascript:
              schema:
                type: object
                properties:
                  resultCount:
                    type: integer
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        wrapperType:
                          type: string
                          description: Name of the returned object, e.g. track, collection, artist.
                        kind:
                          type: string
                          description: Kind of content, e.g. song, feature-movie, software-package.
                        artistName:
                          type: string
                        collectionName:
                          type: string
                        trackName:
                          type: string
                        censoredName:
                          type: string
                        artworkUrl30:
                          type: string
                          format: uri
                        artworkUrl60:
                          type: string
                          format: uri
                        artworkUrl100:
                          type: string
                          format: uri
                        artworkUrl600:
                          type: string
                          format: uri
                        viewUrl:
                          type: string
                          format: uri
                        previewUrl:
                          type: string
                          format: uri
                        trackTimeMillis:
                          type: integer
                        artistId:
                          type: integer
                        collectionId:
                          type: integer
                        trackId:
                          type: integer
                        collectionCensoredName:
                          type: string
                        trackCensoredName:
                          type: string
                        artistViewUrl:
                          type: string
                          format: uri
                        collectionViewUrl:
                          type: string
                          format: uri
                        trackViewUrl:
                          type: string
                          format: uri
                        collectionPrice:
                          type: number
                        trackPrice:
                          type: number
                        collectionExplicitness:
                          type: string
                        trackExplicitness:
                          type: string
                        discCount:
                          type: integer
                        discNumber:
                          type: integer
                        trackCount:
                          type: integer
                        trackNumber:
                          type: integer
                        country:
                          type: string
                        currency:
                          type: string
                        primaryGenreName:
                          type: string
                        description:
                          type: string
                        longDescription:
                          type: string
                        shortDescription:
                          type: string
                        copyright:
                          type: string
                        releaseDate:
                          type: string
                          format: date-time
                        contentAdvisoryRating:
                          type: string
                        feedUrl:
                          type: string
                          format: uri
                        genreIds:
                          type: array
                          items: { type: string }
                        genres:
                          type: array
                          items: { type: string }
                        collectionArtistId:
                          type: integer
                        collectionArtistName:
                          type: string
                        collectionArtistViewUrl:
                          type: string
                          format: uri
                        isStreamable:
                          type: boolean

                        # Software/App Store specific
                        bundleId:
                          type: string
                        currentVersionReleaseDate:
                          type: string
                          format: date-time
                        fileSizeBytes:
                          oneOf:
                            - type: integer
                            - type: string
                        formattedPrice:
                          type: string
                        isGameCenterEnabled:
                          type: boolean
                        isVppDeviceBasedLicensingEnabled:
                          type: boolean
                        minimumOsVersion:
                          type: string
                        price:
                          type: number
                        primaryGenreId:
                          type: integer
                        releaseNotes:
                          type: string
                        sellerName:
                          type: string
                        sellerUrl:
                          type: string
                          format: uri
                        version:
                          type: string
                        averageUserRating:
                          type: number
                        averageUserRatingForCurrentVersion:
                          type: number
                        userRatingCountForCurrentVersion:
                          type: integer
                        userRatingCount:
                          type: integer

                        # Music Video / Artist extras
                        amgArtistId:
                          type: integer
                        amgVideoArtistId:
                          type: integer

                        # Additional link fields
                        artistLinkUrl:
                          type: string
                          format: uri
        '400':
          description: Bad Request
          content:
            text/javascript:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        default:
          description: Error response
