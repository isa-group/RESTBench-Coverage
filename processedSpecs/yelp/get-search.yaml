openapi: 3.0.0
info:
  title: Yelp API
  version: 1.0.0
  description: Yelp Places API - Businesses Search
servers:
  - url: https://api.yelp.com/v3
security:
  - bearerAuth: []
paths:
  /businesses/search:
    get:
      operationId: getBusinesses
      summary: Search businesses
      description: >
        Returns up to 240 businesses based on the provided search criteria.
        Note: Businesses with zero reviews are not returned.
      parameters:
        - name: location
          in: query
          required: false
          description: >
            Required if either latitude or longitude is not provided. A free-form
            location string, e.g. "New York City" or a full address.
          schema:
            type: string
            minLength: 1
            maxLength: 250
        - name: latitude
          in: query
          required: false
          description: Required if location is not provided. Must be paired with longitude.
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: longitude
          in: query
          required: false
          description: Required if location is not provided. Must be paired with latitude.
          schema:
            type: number
            minimum: -180
            maximum: 180
        - name: term
          in: query
          required: false
          description: >
            Search term, e.g. "food" or "restaurants". If omitted, searches across
            a small number of popular categories.
          schema:
            type: string
        - name: radius
          in: query
          required: false
          description: >
            Suggested search radius in meters. Actual radius may vary by density.
            If too large, an AREA_TOO_LARGE error may be returned.
          schema:
            type: integer
            minimum: 0
            maximum: 40000
        - name: categories
          in: query
          required: false
          description: >
            One or more category aliases (comma-delimited). e.g. "bars,french".
            Uses category aliases, not display titles.
          style: form
          explode: false
          schema:
            type: array
            uniqueItems: true
            items:
              type: string
              minLength: 1
        - name: locale
          in: query
          required: false
          description: Locale code in the format {language}_{COUNTRY}, e.g. en_US.
          schema:
            type: string
            pattern: '^[a-z]{2,3}_[A-Z]{2}$'
        - name: price
          in: query
          required: false
          description: >
            Pricing levels to filter by (comma-delimited): 1=$, 2=$$, 3=$$$, 4=$$$$.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 4
            uniqueItems: true
            items:
              type: integer
              minimum: 1
              maximum: 4
        - name: open_now
          in: query
          required: false
          description: When true, only return businesses open now. Cannot be used with open_at.
          schema:
            type: boolean
        - name: open_at
          in: query
          required: false
          description: >
            Unix time (seconds) in the timezone of the search location. Returns
            businesses open at that time. Cannot be used with open_now.
          schema:
            type: integer
        - name: attributes
          in: query
          required: false
          description: >
            Additional filters (comma-delimited). Public: hot_and_new, request_a_quote,
            reservation, waitlist_reservation, deals, gender_neutral_restrooms, open_to_all,
            wheelchair_accessible. Premium plan exposes many more.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
        - name: sort_by
          in: query
          required: false
          description: >
            Suggest sort mode. Default best_match. (Hint only; not strictly enforced.)
          schema:
            type: string
            default: best_match
            enum: [best_match, rating, review_count, distance]
        - name: device_platform
          in: query
          required: false
          description: Determines the platform for mobile_link.
          schema:
            type: string
            enum: [android, ios, mobile-generic]
        - name: reservation_date
          in: query
          required: false
          description: Reservation date in YYYY-mm-dd.
          schema:
            type: string
        - name: reservation_time
          in: query
          required: false
          description: Reservation time in HH:MM.
          schema:
            type: string
        - name: reservation_covers
          in: query
          required: false
          description: Number of people for the reservation.
          schema:
            type: integer
            minimum: 1
            maximum: 10
        - name: matches_party_size_param
          in: query
          required: false
          description: Whether to filter out results without openings matching reservation params.
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
          description: Number of results to return (max 50).
          schema:
            type: integer
            default: 20
            minimum: 0
            maximum: 50
        - name: offset
          in: query
          required: false
          description: Offset into the result set (max 1000).
          schema:
            type: integer
            minimum: 0
            maximum: 1000
      x-dependencies:
        - Or(location, latitude AND longitude)
        - ZeroOrOne(open_now, open_at)
        - offset + limit <= 1000
        - IF offset AND NOT limit THEN offset <= 980
      responses:
        "200":
          description: A list of businesses matching the criteria
          content:
            application/json:
              schema:
                type: object
                required: [businesses, total, region]
                properties:
                  total:
                    type: integer
                    description: >
                      Total matches. You can retrieve at most 240 businesses via
                      combinations of limit/offset.
                  region:
                    type: object
                    required: [center]
                    description: Suggested map region.
                    properties:
                      center:
                        type: object
                        properties:
                          latitude:
                            type: number
                          longitude:
                            type: number
                  businesses:
                    type: array
                    items:
                      type: object
                      description: A Business Yelp finds based on the search criteria.
                      required:
                        - id
                        - alias
                        - name
                        - location
                        - coordinates
                        - phone
                        - display_phone
                      properties:
                        id:
                          type: string
                        alias:
                          type: string
                          description: Unique Yelp alias, may contain Unicode.
                        name:
                          type: string
                        image_url:
                          type: string
                        is_closed:
                          type: boolean
                        url:
                          type: string
                        review_count:
                          type: integer
                          description: Number of reviews.
                        categories:
                          type: array
                          description: List of category title/alias pairs.
                          items:
                            type: object
                            required: [alias, title]
                            properties:
                              alias:
                                type: string
                              title:
                                type: string
                        rating:
                          type: number
                          format: float
                          description: Rating (e.g., 1, 1.5, …, 5.0).
                        coordinates:
                          type: object
                          required: [latitude, longitude]
                          properties:
                            latitude: { type: number }
                            longitude: { type: number }
                        transactions:
                          type: array
                          items:
                            type: string
                            enum: [pickup, delivery, restaurant_reservation]
                        price:
                          type: string
                          description: Currency symbol string for the locale (e.g., $, $$, $$$, $$$$).
                        location:
                          type: object
                          required: [display_address]
                          properties:
                            address1: { type: string, nullable: true }
                            address2: { type: string, nullable: true }
                            address3: { type: string, nullable: true }
                            city: { type: string }
                            country: { type: string }
                            state: { type: string }
                            zip_code: { type: string }
                            display_address:
                              type: array
                              items: { type: string }
                        phone:
                          type: string
                        display_phone:
                          type: string
                        distance:
                          type: number
                          description: Distance in meters from the search location.
                        attributes:
                          type: object
                          description: >
                            Various features/facilities. Premium plan exposes additional attributes.
                        business_hours:
                          type: array
                          description: Regular business hours.
                          items:
                            type: object
                            required:
                              - hours_type
                              - open
                            properties:
                              hours_type:
                                type: string
                                description: Type of business hours (e.g., "REGULAR").
                                example: "REGULAR"
                              is_open_now:
                                type: boolean
                                description: Whether the business is open now.
                              open:
                                type: array
                                description: List of open hours.
                                items:
                                  type: object
                                  required:
                                    - day
                                    - start
                                    - end
                                    - is_overnight
                                  properties:
                                    day:
                                      type: integer
                                      description: Day of the week (0 = Monday, 6 = Sunday).
                                      example: 0
                                    start:
                                      type: string
                                      description: Start of the opening hours in 24-hour format (e.g., "1000" means 10 AM).
                                      example: "1000"
                                    end:
                                      type: string
                                      description: End of the opening hours in 24-hour format (e.g., "2130" means 9:30 PM).
                                      example: "2130"
                                    is_overnight:
                                      type: boolean
                                      description: Whether the time range spans across midnight (`true` if it ends after midnight).
                                      example: false
        "400":
          description: Bad Request.
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                      - description
                    properties:
                      code:
                        type: string
                        description: Error code identifier (e.g., VALIDATION_ERROR)
                        example: "VALIDATION_ERROR"
                      description:
                        type: string
                        description: Human-readable explanation of the validation failure
                        example: "'1760049900   # ~2025-10-09 18:30/20:00/21:45 UTC-ish' is not of type 'integer'"
                      field:
                        type: string
                        description: Name of the request field that failed validation
                        example: "open_at"
                      instance:
                        type: string
                        description: The invalid value sent in the request
                        example: "1760049900   # ~2025-10-09 18:30/20:00/21:45 UTC-ish"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                      - description
                    properties:
                      code:
                        type: string
                        description: Error code identifier.
                        example: "UNAUTHORIZED"
                      description:
                        type: string
                        description: Explanation of why the authentication failed.
                        example: "Invalid Authorization header. API key missing or malformed."
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
