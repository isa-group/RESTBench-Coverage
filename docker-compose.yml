  run-ALL-TWOWAY-INVARIANT:
    <<: *exp-base
    command: >
      bash -lc "
      python3 /app/expScripts/cli.py endpoint --api ProjectTrackingSystem --op-id postAssignments --mode BLACK,BLACK_RANDOM --level INVARIANT --strength TWO_WAY &&
      python3 /app/expScripts/cli.py endpoint --api Market --op-id postRegister --mode BLACK,BLACK_RANDOM --level INVARIANT --strength TWO_WAY &&
      python3 /app/expScripts/cli.py endpoint --api ScoutAPI --op-id postActivities --mode BLACK,BLACK_RANDOM --level INVARIANT --strength TWO_WAY &&
      python3 /app/expScripts/cli.py endpoint --api UserManagement --op-id putUsersId --mode BLACK,BLACK_RANDOM --level INVARIANT --strength TWO_WAY &&
