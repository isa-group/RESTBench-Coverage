      python3 /app/expScripts/cli.py endpoint --api LanguageTool --op-id postCheck --mode BLACK,BLACK_RANDOM --level INVARIANT --strength TWO_WAY &&
      python3 /app/expScripts/cli.py endpoint --api Gestaohospital --op-id postHospital --mode BLACK,BLACK_RANDOM --level INVARIANT --strength TWO_WAY 
