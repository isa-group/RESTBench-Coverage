  run-DEUTSCHEBAHN:
    <<: *exp-base
    command: >
      bash -lc "
      python3 /app/expScripts/cli.py endpoint --api Deutschebahn --op-id getStations --mode BLACK --level FIVE_XX --strength TWO_WAY
