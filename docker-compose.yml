  run-TEMP:
    <<: *exp-base
    command: >
      bash -lc "
      python3 /app/expScripts/cli.py endpoint --api Catwatch --op-id getProjects --strength TWO_WAY &&
      python3 /app/expScripts/cli.py endpoint --api Catwatch --op-id getProjects --mode BLACK,BLACK_RANDOM --level FIVE_XX --strength ONE_WAY,ONE_WAY_REDUCED &&
      python3 /app/expScripts/cli.py preparation --api GenomeNexus --op-id postAnnotation &&
      python3 /app/expScripts/cli.py endpoint --api GenomeNexus --op-id postAnnotation --strength ONE_WAY_REDUCED,ONE_WAY --level FIVE_XX --mode BLACK,BLACK_RANDOM &&
      python3 /app/expScripts/cli.py endpoint --api GenomeNexus --op-id postAnnotation --strength TWO_WAY &&
      python3 /app/expScripts/cli.py endpoint --api Gestaohospital --op-id postHospital --mode WHITE --strength TWO_WAY &&
      python3 /app/expScripts/cli.py endpoint --api LanguageTool --op-id postCheck --mode WHITE --strength TWO_WAY
      "

