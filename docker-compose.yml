    <<: *exp-base
    command: >
      bash -lc "
      python3 /app/expScripts/run_evomaster.py
      "
  
  run-SCHEMATHESIS:
    <<: *exp-base
    command: >
      bash -lc "
      python3 /app/expScripts/run_schemathesis.py
      "
