      python3 /app/expScripts/cli.py endpoint --api PersonController --op-id postPerson --mode BLACK,BLACK_RANDOM --level FIVE_XX --strength ONE_WAY,ONE_WAY_REDUCED &&
      python3 /app/expScripts/cli.py endpoint --api GenomeNexus --op-id postAnnotation --mode BLACK,BLACK_RANDOM --level FIVE_XX --strength ONE_WAY,ONE_WAY_REDUCED &&
      python3 /app/expScripts/cli.py endpoint --api ProxyPrint --op-id postRequestRegister --mode BLACK,BLACK_RANDOM --level FIVE_XX --strength ONE_WAY,ONE_WAY_REDUCED &&
      python3 /app/expScripts/cli.py endpoint --api Catwatch --op-id getProjects --mode BLACK,BLACK_RANDOM --level FIVE_XX --strength ONE_WAY,ONE_WAY_REDUCED &&
      python3 /app/expScripts/cli.py endpoint --api LanguageTool --op-id postCheck --mode BLACK,BLACK_RANDOM --level FIVE_XX --strength ONE_WAY,ONE_WAY_REDUCED &&
      python3 /app/expScripts/cli.py endpoint --api Gestaohospital --op-id postHospital --mode BLACK,BLACK_RANDOM --level FIVE_XX --strength ONE_WAY,ONE_WAY_REDUCED &&
      python3 /app/expScripts/cli.py endpoint --api Stripe --op-id postV1Products --mode BLACK,BLACK_RANDOM --level FIVE_XX --strength ONE_WAY,ONE_WAY_REDUCED &&
      python3 /app/expScripts/cli.py endpoint --api Foursquare --op-id getPlacesSearch --mode BLACK,BLACK_RANDOM --level FIVE_XX --strength ONE_WAY,ONE_WAY_REDUCED &&
      python3 /app/expScripts/cli.py endpoint --api Yelp --op-id getBusinessesSearch --mode BLACK,BLACK_RANDOM --level FIVE_XX --strength ONE_WAY,ONE_WAY_REDUCED &&
      python3 /app/expScripts/cli.py endpoint --api AmadeusHotel --op-id getHotelOffers --mode BLACK,BLACK_RANDOM --level FIVE_XX --strength ONE_WAY,ONE_WAY_REDUCED &&
      python3 /app/expScripts/cli.py endpoint --api YouTube-getVideos --op-id getVideos --mode BLACK,BLACK_RANDOM --level FIVE_XX --strength ONE_WAY,ONE_WAY_REDUCED &&
      python3 /app/expScripts/cli.py endpoint --api DHL --op-id getFindByAddress --mode BLACK,BLACK_RANDOM --level FIVE_XX --strength ONE_WAY,ONE_WAY_REDUCED &&
      python3 /app/expScripts/cli.py endpoint --api FDIC --op-id getInstitutions --mode BLACK,BLACK_RANDOM --level FIVE_XX --strength ONE_WAY,ONE_WAY_REDUCED &&
      python3 /app/expScripts/cli.py endpoint --api Ohsome --op-id getElementsAggregation --mode BLACK,BLACK_RANDOM --level FIVE_XX --strength ONE_WAY,ONE_WAY_REDUCED &&
      python3 /app/expScripts/cli.py endpoint --api Deutschebahn --op-id getStations --mode BLACK,BLACK_RANDOM --level FIVE_XX --strength ONE_WAY,ONE_WAY_REDUCED &&
      python3 /app/expScripts/cli.py endpoint --api iTunes --op-id getSearch --mode BLACK,BLACK_RANDOM --level FIVE_XX --strength ONE_WAY,ONE_WAY_REDUCED
      "

  run-ALL-BLACK-TWOWAY:
    <<: *exp-base
    command: >
      bash -lc "
      python3 /app/expScripts/cli.py endpoint --api ProjectTrackingSystem --op-id postAssignments --mode BLACK,BLACK_RANDOM --level FIVE_XX,OAS,REGRESSION --strength TWO_WAY &&
      python3 /app/expScripts/cli.py endpoint --api Market --op-id postRegister --mode BLACK,BLACK_RANDOM --level FIVE_XX,OAS,REGRESSION --strength TWO_WAY &&
      python3 /app/expScripts/cli.py endpoint --api ScoutAPI --op-id postActivities --mode BLACK,BLACK_RANDOM --level FIVE_XX,OAS,REGRESSION --strength TWO_WAY &&
      python3 /app/expScripts/cli.py endpoint --api UserManagement --op-id putUsersId --mode BLACK,BLACK_RANDOM --level FIVE_XX,OAS,REGRESSION --strength TWO_WAY &&
      python3 /app/expScripts/cli.py endpoint --api PersonController --op-id postPerson --mode BLACK,BLACK_RANDOM --level FIVE_XX,OAS,REGRESSION --strength TWO_WAY &&
      python3 /app/expScripts/cli.py endpoint --api GenomeNexus --op-id postAnnotation --mode BLACK,BLACK_RANDOM --level FIVE_XX,OAS,REGRESSION --strength TWO_WAY &&
      python3 /app/expScripts/cli.py endpoint --api ProxyPrint --op-id postRequestRegister --mode BLACK,BLACK_RANDOM --level FIVE_XX,OAS,REGRESSION --strength TWO_WAY &&
      python3 /app/expScripts/cli.py endpoint --api Catwatch --op-id getProjects --mode BLACK,BLACK_RANDOM --level FIVE_XX,OAS,REGRESSION --strength TWO_WAY &&
      python3 /app/expScripts/cli.py endpoint --api LanguageTool --op-id postCheck --mode BLACK,BLACK_RANDOM --level FIVE_XX,OAS,REGRESSION --strength TWO_WAY &&
      python3 /app/expScripts/cli.py endpoint --api Gestaohospital --op-id postHospital --mode BLACK,BLACK_RANDOM --level FIVE_XX,OAS,REGRESSION --strength TWO_WAY &&
      python3 /app/expScripts/cli.py endpoint --api Stripe --op-id postV1Products --mode BLACK,BLACK_RANDOM --level FIVE_XX --strength TWO_WAY &&
      python3 /app/expScripts/cli.py endpoint --api Foursquare --op-id getPlacesSearch --mode BLACK,BLACK_RANDOM --level FIVE_XX --strength TWO_WAY &&
      python3 /app/expScripts/cli.py endpoint --api Yelp --op-id getBusinessesSearch --mode BLACK,BLACK_RANDOM --level FIVE_XX --strength TWO_WAY &&
      python3 /app/expScripts/cli.py endpoint --api AmadeusHotel --op-id getHotelOffers --mode BLACK,BLACK_RANDOM --level FIVE_XX --strength TWO_WAY &&
      python3 /app/expScripts/cli.py endpoint --api YouTube-getVideos --op-id getVideos --mode BLACK,BLACK_RANDOM --level FIVE_XX --strength TWO_WAY &&
      python3 /app/expScripts/cli.py endpoint --api DHL --op-id getFindByAddress --mode BLACK,BLACK_RANDOM --level FIVE_XX --strength TWO_WAY &&
      python3 /app/expScripts/cli.py endpoint --api FDIC --op-id getInstitutions --mode BLACK,BLACK_RANDOM --level FIVE_XX --strength TWO_WAY &&
      python3 /app/expScripts/cli.py endpoint --api Ohsome --op-id getElementsAggregation --mode BLACK,BLACK_RANDOM --level FIVE_XX --strength TWO_WAY &&
