  run-OHSOME:
    <<: *exp-base
    command: >
      bash -lc "
      python3 /app/expScripts/cli.py endpoint --api Ohsome --op-id getElementsAggregation --mode BLACK --level FIVE_XX &&
      python3 /app/expScripts/cli.py endpoint --api Ohsome --op-id getElementsAggregation --mode BLACK_RANDOM --level FIVE_XX
