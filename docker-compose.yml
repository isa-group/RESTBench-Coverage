      python3 /app/expScripts/cli.py endpoint --api Market --op-id postRegister --mode BLACK,BLACK_RANDOM --level FIVE_XX --strength ONE_WAY,ONE_WAY_REDUCED &&
      python3 /app/expScripts/cli.py endpoint --api ScoutAPI --op-id postActivities --mode BLACK,BLACK_RANDOM --level FIVE_XX --strength ONE_WAY,ONE_WAY_REDUCED &&
