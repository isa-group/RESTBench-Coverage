---
swagger: '2.0'
info:
  version: 3.0.5
  title: Hotel Search API
  description: "Before using this API, we recommend you read our **[Authorization
    Guide](https://developers.amadeus.com/self-service/apis-docs/guides/authorization-262)**
    for more information on how to generate an access token. \n\nPlease also be aware
    that our test environment is based on a subset of the production for this API
    it may change dynamically. For your tests, use big cities like LON (London) or
    NYC (New-York)."
host: test.api.amadeus.com
basePath: "/v3"
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
paths:
  "/shopping/hotel-offers":
    get:
      summary: getMultiHotelOffers
      description: ""
      tags: [shopping]
      operationId: getMultiHotelOffers
      produces:
        - application/vnd.amadeus+json
      parameters:
        - name: hotelIds
          in: query
          required: true
          description: "Amadeus property codes (8 chars). Comma-separated list; 1–20 items."
          type: array
          items:
            type: string
            pattern: "^[A-Z0-9]{8}$"
          minItems: 1
          maxItems: 20
          collectionFormat: csv
          x-example:
            - MCLONGHM
        - name: adults
          in: query
          required: true
          description: "Number of adult guests (1–9) per room."
          type: integer
          format: int32
          minimum: 1
          maximum: 9
        - name: checkInDate
          in: query
          required: false
          description: "Check-in date (hotel local date), YYYY-MM-DD. No past dates."
          type: string
          format: date
        - name: checkOutDate
          in: query
          required: false
          description: "Check-out date (hotel local date), YYYY-MM-DD. Must be >= checkInDate+1."
          type: string
          format: date
        - name: countryOfResidence
          in: query
          required: false
          description: "Traveler country of residence (ISO 3166-1 alpha-2)."
          type: string
          pattern: "^[A-Z]{2}$"
        - name: roomQuantity
          in: query
          required: false
          description: "Number of rooms requested (1–9)."
          type: integer
          format: int32
          minimum: 1
          maximum: 9
        - name: priceRange
          in: query
          required: false
          description: "Price per night interval, e.g. 200-300 or -300 or 100. If set, **currency is mandatory**."
          type: string
        - name: currency
          in: query
          required: false
          description: "Requested currency (ISO 4217, 3 letters). If unsupported, hotel local currency will be returned."
          type: string
          pattern: "^[A-Z]{3}$"
        - name: paymentPolicy
          in: query
          required: false
          description: "Filter by payment type."
          type: string
          enum: [GUARANTEE, DEPOSIT, NONE]
          default: NONE
        - name: boardType
          in: query
          required: false
          description: "Filter by included meals."
          type: string
          enum: [ROOM_ONLY, BREAKFAST, HALF_BOARD, FULL_BOARD, ALL_INCLUSIVE]
        - name: includeClosed
          in: query
          required: false
          description: "Include sold-out properties."
          type: boolean
        - name: bestRateOnly
          in: query
          required: false
          description: "Return only the cheapest offer per hotel."
          type: boolean
          default: true
        - name: lang
          in: query
          required: false
          description: "Language of descriptive texts (e.g., FR, fr-FR). If unavailable, English will be returned."
          type: string
          pattern: "^[a-zA-Z0-9-]{2,5}$"
      x-dependencies:
        - IF priceRange THEN currency;
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/MultiResponse"
        "400":
          description: "Bad Request (see error code/title in payload)"
          schema:
            $ref: "#/definitions/Errors"
        "401":
          description: "Unauthorized"
          schema:
            $ref: "#/definitions/Errors"
        "500":
          description: Internal server error
          schema:
            $ref: "#/definitions/Errors"
definitions:
  Warnings:
    title: Warnings
    description: |
      A set of non-fatal warnings returned by the Amadeus API.
      Each warning object follows the same structure as an Error,
      but indicates recoverable or informational issues (e.g., provider format checks, no availability, etc.).
    type: array
    items:
      $ref: "#/definitions/Warning"

  Warning:
    title: Warning
    description: A non-fatal warning object returned by the API.
    type: object
    properties:
      code:
        description: Numeric warning code (similar to error codes).
        type: integer
        format: int32
        example: 3664
      title:
        description: Short title or summary of the warning.
        type: string
        example: NO ROOMS AVAILABLE AT REQUESTED PROPERTY
      detail:
        description: Detailed description of the warning.
        type: string
        example: Provider Error - NO ROOMS AVAILABLE AT REQUESTED PROPERTY
      source:
        $ref: "#/definitions/Warning_Source"

  Warning_Source:
    title: Warning_Source
    description: Identifies which parameter or element in the request caused the warning.
    type: object
    properties:
      parameter:
        description: Name or value of the parameter that triggered the warning.
        type: string
        example: hotelIds=HXMIAFZ7,HXNYC320
  RoomInformation:
    title: RoomInformation
    description: |
      Detailed information about the room offered by the hotel.
      Contains both the provider’s raw room type code and Amadeus’ estimated parsing of that type.
    type: object
    properties:
      description:
        type: string
        description: Free-text room description provided by the property or provider.
        example: >
          STAY LONGER & SAVE Special savings when you
          stay longer and reserve in advance. Deposit and
          1 King Bed Standard 320 SqFt Room with
          Microwave Minifridge
      type:
        type: string
        description: |
          Room type code (3-character Amadeus or provider identifier).
          * The first character identifies the room category.
          * The second numeric character identifies the number of beds.
          * The third character identifies the bed type.
          Example: "A1K" for 1 King, "T2D" for 2 Doubles.
        pattern: "^[A-Z0-9*]{3}$"
        example: "*1K"
      typeEstimated:
        $ref: "#/definitions/RoomTypeEstimated"

  RoomTypeEstimated:
    title: RoomTypeEstimated
    description: |
      Amadeus’ estimation of the room’s characteristics, derived from provider description.
    type: object
    properties:
      bedType:
        type: string
        description: Type of bed in the room.
        enum:
          - TWIN
          - KING
          - QUEEN
          - DOUBLE
          - SINGLE
          - SOFA_BED
          - BUNK
          - OTHER
        example: KING
      beds:
        type: integer
        format: int32
        description: Number of beds in the room (1–9).
        minimum: 1
        maximum: 9
        example: 1
      category:
        type: string
        description: |
          Room category (e.g., STANDARD_ROOM, SUITE, STUDIO, DELUXE, VILLA).
          Indicates Amadeus’ normalized classification of the room type.
        example: STANDARD_ROOM

  HotelOffers:
    title: HotelOffers
    type: object
    properties:
      type:
        description: the type of the object (hotel-offers)
        type: string
      available:
        type: boolean
      self:
        type: string
      offers:
        type: array
        items:
          "$ref": "#/definitions/HotelOffer"
      hotel:
        "$ref": "#/definitions/Hotel"
  PricingResponse:
    title: PricingResponse
    type: object
    properties:
      data:
        "$ref": "#/definitions/HotelOffers"
  Errors:
    title: Errors
    description: A set of errors
    type: object
    properties:
      errors:
        type: array
        items:
          "$ref": "#/definitions/Error"
  MultiResponse:
    title: MultiResponse
    type: object
    properties:
      dictionaries: # Added
        type: object
        description: "Dictionary of Conversion rates"
        properties:
          currencyConversionLookupRates:
            type: object
            additionalProperties:
              type: object
      data:
        type: array
        items:
          $ref: "#/definitions/HotelOffers"
      warnings:
        "$ref": "#/definitions/Warnings"
    example:
      data:
        - type: hotel-offers
          hotel:
            type: hotel
            hotelId: HLLON101
            chainCode: HL
            dupeId: '700027723'
            name: THE TRAFALGAR
            cityCode: LON
            latitude: 51.50729
            longitude: -0.12889
          available: true
          offers:
            - id: 1BCMABM7A8
              checkInDate: '2021-11-20'
              checkOutDate: '2021-11-21'
              rateCode: RAC
              rateFamilyEstimated:
                code: PRO
                type: P
              commission:
                percentage: '8.00'
              room:
                type: M1K
                typeEstimated:
                  category: STANDARD_ROOM
                  beds: 1
                  bedType: KING
                description:
                  text: |-
                    ADVANCE PURCHASE
                    TRAFALGAR KING ROOM
                    COMP WIFI/COFFEE-TEA FACILITIES/USB PORT
                  lang: EN
              guests:
                adults: 1
              price:
                currency: GBP
                base: '300.00'
                total: '300.00'
                taxes:
                  - code: TOTAL_TAX
                    amount: '0.00'
                    currency: GBP
                    included: true
                variations:
                  average:
                    base: '305.50'
                  changes:
                    - startDate: '2021-11-20'
                      endDate: '2021-11-21'
                      total: '300.00'
              policies:
                paymentType: deposit
                cancellation:
                  type: FULL_STAY
                  description:
                    text: Non refundable rate
                    lang: EN
              self: https://test.api.amadeus.com/v3/shopping/hotel-offers/1BCMABM7A8
          self: https://test.api.amadeus.com/v3/shopping/hotel-offers?hotelIds=HLLON101&adults=1&checkInDate=2021-11-20&paymentPolicy=NONE&roomQuantity=1
  Hotel:
    title: Hotel
    description: Hotel Content
    type: object
    properties:
      hotelId:
        description: Amadeus Property Code (8 chars)
        example: ADPAR001
        type: string
        pattern: "^[A-Z0-9]{8}$"
      chainCode:
        description: Brand (RT...) or Merchant (AD...) (Amadeus 2 chars Code)
        example: AD
        type: string
        pattern: "^[A-Z]{2}$"
      brandCode:
        description: |-
          Brand (RT...) (Amadeus 2 chars Code). Small Properties distributed by Merchants may not have a Brand.
          Example - AD (Value Hotels) is the Provider/Merchant, and RT (Accor) is the Brand of the Property
        example: RT
        type: string
        pattern: "^[A-Z]{2}$"
      dupeId:
        description: |-
          Unique Property identifier of the physical hotel.
          One physical hotel can be represented by different Providers, each one having its own `hotelID`.
          This attribute allows a client application to group together hotels that are actually the same.
        example: '501132260'
        type: string
      name:
        description: Hotel Name
        example: Hotel de Paris
        type: string
      cityCode:
        description: 'Warning: The IATA city code associated to the hotel (not necessary
          the real Hotel City)'
        example: PAR
        type: string
        pattern: "^[A-Z]{3}$"
      latitude:   # Added
        description: "Latitude"
        type:  number
      longitude:  # Added
        description: "Longitude"
        type: number
      type:       # Added
        description: "type"
        type: string
  HotelOffer:
    title: HotelOffer
    description: Hotel Offer
    type: object
    properties:
      roomInformation: # Added
        $ref: "#/definitions/RoomInformation"
      type:
        "$ref": "#/definitions/Type"
      id:
        description: Unique identifier of this offer. Might be valid for a temporary
          period only.
        example: 63A93695B58821ABB0EC2B33FE9FAB24D72BF34B1BD7D707293763D8D9378FC3
        type: string
        minLength: 2
        maxLength: 100
        pattern: "^[A-Z0-9]*$"
      checkInDate:
        description: |-
          check-in date of the stay (hotel local date). Format YYYY-MM-DD
          The lowest accepted value is today date (no dates in the past).
        example: '2020-12-30'
        type: string
        format: date
      checkOutDate:
        description: |-
          check-out date of the stay (hotel local date). Format YYYY-MM-DD
          The lowest accepted value is `checkInDate`+1.
        example: '2020-12-31'
        type: string
        format: date
      roomQuantity:
        description: number of rooms (1-9)
        example: 1
        type: integer
      rateCode:
        description: |-
          Special Rate - Provider Response Code (3 chars)
          Examples

            * RAC - Rack

            * BAR - Best Available Rate

            * PRO - Promotional

            * COR - Corporate

            * GOV - Government (qualified)

            * AAA - AAA (qualified)

            * BNB - Bed and Breakfast

            * PKG - Package

            * TVL - Travel Industry

            * SPC - Special Promo Rate

            * WKD - Weekend

            * CON - Convention

            * SNR - Senior (Europe) (qualified)

            * ARP - AARP - American Association of Retired People (50+) (qualified)

            * SRS - Senior (qualified)

            * ROR - Room Only Rate (no breakfast)

            * FAM - Family

            * DAY - Day rate
        example: RAC
        type: string
        minLength: 3
        maxLength: 3
        pattern: "^[A-Z0-9*]{3}$"
      rateFamilyEstimated:
        "$ref": "#/definitions/HotelProduct_RateFamily"
      category:
        description: |-
          Special Rate Category
          Examples:
            ASSOCIATION
            FAMILY_PLAN
        example: FAMILY_PLAN
        type: string
      description:
        "$ref": "#/definitions/QualifiedFreeText"
      commission:
        "$ref": "#/definitions/HotelProduct_Commission"
      boardType:
        "$ref": "#/definitions/BoardType"
      room:
        "$ref": "#/definitions/HotelProduct_RoomDetails"
      guests:
        "$ref": "#/definitions/HotelProduct_Guests"
      price:
        "$ref": "#/definitions/HotelProduct_HotelPrice"
      policies:
        "$ref": "#/definitions/HotelProduct_PolicyDetails"
      self:
        description: A self link to the object. Use this to refresh the Offer price
        example: https://test.travel.api.amadeus.com/v2/shopping/hotel-offers/63A93695B58821ABB0EC2B33FE9FAB24D72BF34B1BD7D707293763D8D9378FC3
        type: string
      cancelPolicyHash: # Added
        description: "Cancel policy hash"
        type: string
    required:
#      - id
      - rateCode
      - room
      - price
  BoardType:
    title: BoardType
    description: The included Breakfast/Meals
    type: string
    enum:
      - ROOM_ONLY
      - BREAKFAST
      - HALF_BOARD
      - FULL_BOARD
      - ALL_INCLUSIVE
      - BUFFET_BREAKFAST
      - CARIBBEAN_BREAKFAST
      - CONTINENTAL_BREAKFAST
      - ENGLISH_BREAKFAST
      - FULL_BREAKFAST
      - DINNER_BED_AND_BREAKFAST
      - LUNCH
      - DINNER
      - FAMILY_PLAN
      - AS_BROCHURED
      - SELF_CATERING
      - BERMUDA
      - AMERICAN
      - FAMILY_AMERICAN
      - MODIFIED
  Error:
    title: Error
    description: The Error Definition
    type: object
    properties:
      status:
        description: The [HTTP status code](https://www.iana.org/assignments/http-status-codes/http-status-codes.xhtml)
          of this response. This is present only in terminal errors which cause an
          unsuccessful response. In the case of multiple errors, they must all have
          the same status.
        type: integer
        format: int32
      code:
        description: A machine-readable error code from the Amadeus Canned Messages
          table, that will enable the API Consumers code to handle this type of error
        type: integer
        format: int32
      title:
        description: An error title from the Canned Messages table with a 1:1 correspondence
          to the error code. This may be localized
        type: string
      detail:
        description: An easy-to-read explanation specific to this occurrence of the
          problem. It should give the API consumer an idea of what went wrong and
          how to recover from it. Like the title, this field’s value can be localized.
        type: string
      source:
        "$ref": "#/definitions/Error_Source"
      documentation:
        description: A link to a web page or file with further documentation to help
          the API consumer resolve this error
        type: string
  Error_Source:
    title: Error_Source
    type: object
    properties:
      parameter:
        description: The key of the URI path or query parameter that caused the error
        type: string
      pointer:
        description: A JSON Pointer [RFC6901] to the associated entity in the request
          body that caused this error
        type: string
      example:
        description: A sample input to guide the user when resolving this issue
        type: string
  HotelProduct_CancellationPolicy:
    title: HotelProduct_CancellationPolicy
    type: object
    properties:
      type:
        "$ref": "#/definitions/CancellationType"
      amount:
        description: Amount of the cancellation fee.
        type: string
      #        pattern: "^\\\\d+(\\\\.\\\\d+)?$"
      numberOfNights:
        description: Number of nights due as fee in case of cancellation.
        type: integer
        minimum: 0
        format: int32
      percentage:
        description: Percentage of the total stay amount to be paid in case of cancellation.
          Value is between 0 and 100.
        type: string
      #        pattern: "^\\\\d+(\\\\.\\\\d+)?$"
      deadline:
        description: |-
          Represents the deadline after which the penalty applies. DateTime is in ISO 8601 [https://www.w3.org/TR/NOTE-datetime].
          Example: 2010-08-14T12:00:00+01:00
          Example: 2010-08-14T12:00:00Z
          Example: 2010-08-14T12:00:00-01:00
          The value is expressed in the hotel local time zone, with the added time zone difference. So you can compute the deadline in UTC(GMT) if desired.
        type: string
      #        format: date-time
      description:
        "$ref": "#/definitions/QualifiedFreeText"
      policyType:
        description: Provider-supplied classification of the policy (for example, CANCELLATION).
        type: string
  HotelProduct_CheckInOutPolicy:
    title: HotelProduct_CheckInOutPolicy
    type: object
    properties:
      checkIn:
        description: Check-in From time limit in ISO-8601 format [http://www.w3.org/TR/xmlschema-2/#time]
        example: '13:00:00'
        type: string
      checkInDescription:
        "$ref": "#/definitions/QualifiedFreeText"
      checkOut:
        description: Check-out Until time limit in ISO-8601 format [http://www.w3.org/TR/xmlschema-2/#time]
        example: '11:00:00'
        type: string
      checkOutDescription:
        "$ref": "#/definitions/QualifiedFreeText"
  HotelProduct_Commission:
    title: HotelProduct_Commission
    type: object
    properties:
      percentage:
        description: Percentage of the commission paid to the travel seller. Value
          is between 0 and 100
        type: string
      #        pattern: "^\\\\d+(\\\\.\\\\d+)?$"
      amount:
        description: Amount of the commission paid to the travel seller. The amount
          is always linked to the currency code of the offer
        type: string
      #        pattern: "^\\\\d+(\\\\.\\\\d+)?$"
      description:
        "$ref": "#/definitions/QualifiedFreeText"
  HotelProduct_DepositPolicy:
    title: HotelProduct_DepositPolicy
    description: the deposit/prepay policy information applicable to the offer. It
      includes accepted payments, deadline and the amount due
    type: object
    properties:
      amount:
        description: Deposit-Prepay amount
        type: string
      #        pattern: "^\\\\d+(\\\\.\\\\d+)?$"
      deadline:
        description: "The date and time of the deadline in ISO 8601[https://www.w3.org/TR/NOTE-datetime].
          \n Example: 2010-08-14T13:00:00\n Please note that this value is expressed
          in the hotels local time zone"
        type: string
      #        format: date-time
      description:
        "$ref": "#/definitions/QualifiedFreeText"
      acceptedPayments:
        "$ref": "#/definitions/HotelProduct_PaymentPolicy"
  HotelProduct_EstimatedRoomType:
    title: HotelProduct_EstimatedRoomType
    description: estimated room category, bed type and number of beds in the room.
      This information has been parsed from the room description, and is thus only
      provided for informational purposes
    type: object
    properties:
      category:
        description: Category code
        type: string
      beds:
        description: Number of beds in the room (1-9)
        type: integer
        format: int32
      bedType:
        description: Type of the bed
        type: string
  HotelProduct_GuaranteePolicy:
    title: HotelProduct_GuaranteePolicy
    description: the guarantee policy information applicable to the offer. It includes
      accepted payments
    type: object
    properties:
      description:
        "$ref": "#/definitions/QualifiedFreeText"
      acceptedPayments:
        "$ref": "#/definitions/HotelProduct_PaymentPolicy"
  HotelProduct_Guests:
    title: HotelProduct_Guests
    type: object
    properties:
      adults:
        description: number of adult guests (1-9) per room
        example: 2
        type: integer
        minimum: 1
        maximum: 9
        format: int32
      childAges:
        description: Comma separated list of ages of each child at the time of check-out
          from the hotel. If several children have the same age, the ages will be
          repeated.
        type: array
        items:
          type: integer
          minimum: 0
          maximum: 20
          format: int32
        minimum: 0
        maximum: 20
  HotelProduct_HoldPolicy:
    title: HotelProduct_HoldPolicy
    description: the hold policy
    type: object
    properties:
      deadline:
        description: "The date and time of the deadline in ISO 8601[https://www.w3.org/TR/NOTE-datetime].
          \n Example: 2010-08-14T13:00:00\n Please note that this value is expressed
          in the hotels local time zone"
        type: string
    #        format: date-time
    required:
      - deadline
  HotelProduct_HotelPrice:
    title: HotelProduct_HotelPrice
    description: price information
    type: object
    properties:
      currency:
        description: currency Code apply to all elements of the price
        type: string
      sellingTotal:
        description: sellingTotal = Total + margins + markup + totalFees - discounts
        type: string
      total:
        description: total = base + totalTaxes
        type: string
      base:
        type: string
      taxes:
        type: array
        items:
          "$ref": "#/definitions/Tax"
      markups:
        type: array
        items:
          "$ref": "#/definitions/Markup"
      variations:
        "$ref": "#/definitions/HotelProduct_PriceVariations"
  HotelProduct_PaymentPolicy:
    title: HotelProduct_PaymentPolicy
    description: Accepted Payment Methods and Card Types. Several Payment Methods
      and Card Types may be available.
    type: object
    properties:
      creditCardPolicies:
        "$ref": "#/definitions/CreditCardPolicies"
      creditCards:
        description: Accepted Payment Card Types for the `method` CREDIT_CARD
        type: array
        items:
          type: string
          minLength: 2
          maxLength: 2
          pattern: "^[A-Z]{2}$"
        minLength: 2
        maxLength: 2
        pattern: "^[A-Z]{2}$"
      methods:
        description: Accepted Payment Methods
        type: array
        items:
          "$ref": "#/definitions/Method"
  CreditCardPolicies:
    title: CreditCardPolicies
    description: |
      List of accepted credit card types for this hotel offer.
      Each item contains the two-letter vendor code of a supported card network.
      Common codes include:
        * AX – American Express
        * VI – Visa
        * CA – MasterCard
        * DC – Diners Club
        * CB – Carte Blanche
        * JC – JCB
        * DS – Discover
    type: array
    items:
      $ref: "#/definitions/CreditCardPolicy"

  CreditCardPolicy:
    title: CreditCardPolicy
    description: |
      Accepted credit card type, expressed using a two-letter vendor code
      defined by Amadeus and IATA standards.
    type: object
    properties:
      vendorCode:
        type: string
        description: |
          Two-letter code identifying the credit card network.
          Example codes:
            * AX – American Express  
            * VI – Visa  
            * CA – MasterCard  
            * DC – Diners Club  
            * CB – Carte Blanche  
            * JC – JCB  
            * DS – Discover
        pattern: "^[A-Z]{2}$"
        example: VI
  Refundable:
    title: Refundable
    description: |
      Refundability information of the hotel offer.
      Indicates whether the rate is refundable or not based on the provider’s cancellation policy.
    type: object
    properties:
      cancellationRefund:
        type: string
        example: REFUNDABLE
  HotelProduct_PolicyDetails:
    title: HotelProduct_PolicyDetails
    description: Booking Rules
    type: object
    properties:
      refundable:
        "$ref": "#/definitions/Refundable"
      paymentType:
        "$ref": "#/definitions/PaymentType"
      guarantee:
        "$ref": "#/definitions/HotelProduct_GuaranteePolicy"
      deposit:
        "$ref": "#/definitions/HotelProduct_DepositPolicy"
      prepay:
        "$ref": "#/definitions/HotelProduct_DepositPolicy"
      holdTime:
        "$ref": "#/definitions/HotelProduct_HoldPolicy"
      cancellation:
        "$ref": "#/definitions/HotelProduct_CancellationPolicy"
      cancellations:
        type: array
        items:
          $ref: "#/definitions/HotelProduct_CancellationPolicy"
      checkInOut:
        "$ref": "#/definitions/HotelProduct_CheckInOutPolicy"
  HotelProduct_PriceVariation:
    title: HotelProduct_PriceVariation
    description: Some prices may vary during a stay, thus here you can see the daily
      price per period of the stay
    type: object
    properties:
      startDate:
        description: |-
          Begin date of the period
          Format: YYYY-MM-DD
        type: string
        format: date
      endDate:
        description: |-
          End date of the period
          Format: YYYY-MM-DD
        type: string
        format: date
      currency:
        description: currency Code apply to all elements of the price
        type: string
      sellingTotal:
        description: sellingTotal = Total + margins + markup + totalFees - discounts
        type: string
      total:
        description: total = base + totalTaxes
        type: string
      base:
        type: string
      markups:
        type: array
        items:
          "$ref": "#/definitions/Markup"
    required:
      - startDate
      - endDate
  HotelProduct_PriceVariations:
    title: HotelProduct_PriceVariations
    description: Daily price variations and the average daily price (when available)
      is shown here
    type: object
    properties:
      average:
        "$ref": "#/definitions/Price"
      changes:
        description: A collection of price periods if the daily price changes during
          the stay
        type: array
        items:
          "$ref": "#/definitions/HotelProduct_PriceVariation"
  HotelProduct_RateFamily:
    title: HotelProduct_RateFamily
    description: The estimated rate code family of the offer. Grouping various rate
      plan codes that belongs to the same family and indicates the type of the rate
    type: object
    properties:
      code:
        description: The estimated rate family (PRO,FAM,GOV)
        type: string
        pattern: "[A-Z0-9]{3}"
      type:
        description: The type of the rate (public=P, negotiated=N, conditional=C)
        type: string
        pattern: "[PNC]"
  HotelProduct_RoomDetails:
    title: HotelProduct_RoomDetails
    type: object
    properties:
      type:
        description: "Room type code, 3 character identifier of the room.\nThe first
          character identifies the room type category. \nThe second numeric character
          identifies the number of beds. \nThe third character identifies the bed
          type. \nThere is a special case where ROH is returned, this value stands
          for Run Of House."
        type: string
        pattern: "^[A-Z0-9*]{3}$"
      typeEstimated:
        "$ref": "#/definitions/HotelProduct_EstimatedRoomType"
      description:
        "$ref": "#/definitions/QualifiedFreeText"
  Markup:
    title: Markup
    description: Markup applied to provide a service or a product to the client. The
      markup can be introduced by any stakeholder. Typical use case is to convey markup
      information set by the travel agent or in case of merchant mode.
    type: object
    properties:
      amount:
        description: Defines the monetary value with decimal position as a String.
        example: '10'
        type: string
  Method:
    title: Method
    description: |-
      The Payment Methods
       * CREDIT_CARD (CC) - Payment Cards in `creditCards` are accepted
       * AGENCY_ACCOUNT - Agency Account (Credit Line) is accepted. Agency is Charged at CheckOut
       * TRAVEL_AGENT_ID - Agency IATA/ARC Number is accepted to Guarantee the booking
       * CORPORATE_ID (COR-ID) - Corporate Account is accepted to Guarantee the booking
       * HOTEL_GUEST_ID - Hotel Chain Rewards Card Number is accepted to Guarantee the booking
       * CHECK - Checks are accepted
       * MISC_CHARGE_ORDER - Miscellaneous Charge Order is accepted
       * ADVANCE_DEPOSIT - Cash is accepted for Deposit/PrePay
       * COMPANY_ADDRESS - Company Billing Address is accepted to Guarantee the booking
    type: string
    enum:
      - CREDIT_CARD
      - AGENCY_ACCOUNT
      - TRAVEL_AGENT_ID
      - CORPORATE_ID
      - HOTEL_GUEST_ID
      - CHECK
      - MISC_CHARGE_ORDER
      - ADVANCE_DEPOSIT
      - COMPANY_ADDRESS
      - VCC_BILLBACK
      - VCC_B2B_WALLET
      - DEFERED_PAYMENT
      - TRAVEL_AGENT_IMMEDIATE
  PaymentType:
    title: PaymentType
    description: payment type. Guarantee means Pay at Check Out. Check the `methods`
      in `guarantee` or `deposit` or `prepay`.
    type: string
    enum:
      - GUARANTEE
      - DEPOSIT
      - PREPAY
      - HOLDTIME
      - guarantee   # Added
      - deposit     # Added
      - prepay      # Added
      - holdtime    # Added
  Price:
    title: Price
    description: Price valuation information
    type: object
    properties:
      currency:
        description: currency Code apply to all elements of the price
        type: string
      sellingTotal:
        description: sellingTotal = Total + margins + markup + totalFees - discounts
        type: string
      total:
        description: total = base + totalTaxes
        type: string
      base:
        type: string
      markups:
        type: array
        items:
          "$ref": "#/definitions/Markup"
  QualifiedFreeText:
    title: QualifiedFreeText
    description: Specific type to convey a list of string for specific information
      type ( via qualifier) in specific character set, or language
    type: object
    properties:
      text:
        description: Free Text
        example: A description
        type: string
      lang:
        description: see RFC 5646
        example: fr-FR
        type: string
  Tax:
    title: Tax
    description: 'IATA Tax definition: An impost for raising revenue for the general
      treasury and which will be used for general public purposes.'
    type: object
    properties:
      applicableDate: # added
        type: object
        properties:
          start:
            type: string
            format: date
          end:
            type: string
            format: date
      amount:
        description: Defines amount with decimal separator.
        type: string
      currency:
        description: 'Defines a monetary unit. It is a three alpha code (iata code).
          Example: EUR for Euros, USD for US dollar, etc.'
        type: string
        minLength: 1
        maxLength: 3
      code:
        description: International Standards Organization (ISO) Tax code.It is a two-letter
          country code.
        type: string
      percentage:
        description: In the case of a tax on TST value, the percentage of the tax
          will be indicated in this field.
        type: string
      included:
        description: Indicates if tax is included or not
        type: boolean
      description:
        description: Example - "Governement tax"
        type: string
      pricingFrequency:
        description: |-
          Specifies if the tax applies per stay or per night
            - PER_STAY
            - PER_NIGHT
        type: string
      pricingMode:
        description: |-
          Specifies if the tax applies per occupant or per room
            - PER_OCCUPANT
            - PER_PRODUCT
        type: string
  Type:
    title: Type
    description: data type
    type: string
    enum:
      - hotel-offer
  CancellationType:
    title: CancellationType
    description: "* FULL_STAY: the Penalty amount equals the `total` price."
    type: string
    enum:
      - FULL_STAY
tags:
  - name: shopping
    description: ''
