openapi: 3.0.1
info:
  title: Quick start project
  description: Quick start project using Java, Spring boot and MongoDB
  contact:
    name: Maxime Beugnet
    url: https://github.com/MaBeuLux88
    email: maxime.beugnet@gmail.com
  license:
    name: Apache License Version 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: 1.0.0
servers:
  - url: http://localhost:50111/
tags:
  - name: person-controller
    description: Person Controller
paths:
  /api/person:
    post:
      tags:
        - person-controller
      summary: postPerson
      operationId: postPersonUsingPOST
      requestBody:
        description: person
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonReq"
        required: true
      responses:
        201:
          description: Created
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/PersonRes"
        401:
          description: Unauthorized
          content: {}
        403:
          description: Forbidden
          content: {}
        404:
          description: Not Found
          content: {}
        500:
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: string
                # $ref: '#/components/schemas/ErrorResponse'
              examples:
                sample:
                  value:
                    cause:
                      message: "Cannot deserialize value of type `int` from String \"1w\"..."
                      localizedMessage: "Cannot deserialize value of type `int` from String \"1w\"..."
                      value: "1w"
                      targetType: "int"
                      pathReference: "com.mongodb.starter.models.Person[\"age\"]"
                      originalMessage: "Cannot deserialize value of type `int` from String \"1w\"..."
                      path:
                        - index: -1
                          fieldName: "age"
                          description: "com.mongodb.starter.models.Person[\"age\"]"
                      stackTrace:
                        - className: "com.fasterxml.jackson.databind.exc.InvalidFormatException"
                          fileName: "InvalidFormatException.java"
                          methodName: "from"
                          lineNumber: 67
                          nativeMethod: false
                        - className: "com.fasterxml.jackson.databind.DeserializationContext"
                          fileName: "DeserializationContext.java"
                          methodName: "weirdStringException"
                          lineNumber: 2002
                          nativeMethod: false
                      cause: null
                      location:
                        sourceRef: {}
                    timestamp: "2025-10-19T15:05:17.785+00:00"
                    status: 500
                    error: "Internal Server Error"
                    message: ""
                    path: "/api/person"
      x-codegen-request-body-name: person
components:
  schemas:
    ErrorResponse:
      type: object
      description: Standard error envelope returned on server errors.
      required: [timestamp, status, error, path]
      properties:
        cause:
          $ref: '#/components/schemas/ExceptionCause'
        timestamp:
          type: string
          format: date-time
          description: Time of the error occurrence (ISO 8601).
        status:
          type: integer
          format: int32
          description: HTTP status code.
          example: 500
        error:
          type: string
          description: HTTP reason phrase.
          example: Internal Server Error
        message:
          type: string
          description: Human-readable message (may be empty).
          example: ""
        path:
          type: string
          description: Request path.
          example: /api/person

    ExceptionCause:
      type: object
      description: Nested exception information (may be recursive).
      properties:
        cause:
          $ref: '#/components/schemas/ExceptionCause'
          x-nullable: true
          description: Underlying cause, if any.
        stackTrace:
          type: array
          items:
            $ref: '#/components/schemas/StackTraceElement'
        value:
          type: string
          description: Offending value from payload (if provided).
        targetType:
          type: string
          description: Target Java type for deserialization.
          example: int
        pathReference:
          type: string
          description: Path to the problematic field in the target model.
          example: com.mongodb.starter.models.Person["age"]
        message:
          type: string
          description: Exception message.
        localizedMessage:
          type: string
          description: Localized exception message.
        path:
          type: array
          description: Logical path elements pointing to the failing field.
          items:
            $ref: '#/components/schemas/PathReference'
        originalMessage:
          type: string
          description: Original exception message.
        location:
          type: object
          description: Additional location context (structure may vary).
          additionalProperties: true

    StackTraceElement:
      type: object
      description: Single Java stack trace element.
      required: [className, methodName]
      properties:
        methodName:
          type: string
        fileName:
          type: string
          nullable: true
        lineNumber:
          type: integer
          format: int32
          nullable: true
        className:
          type: string
        nativeMethod:
          type: boolean
          nullable: true

    PathReference:
      type: object
      description: Path entry describing where the error occurred.
      properties:
        index:
          type: integer
          format: int32
          nullable: true
          description: Index for array-like locations; -1 when not applicable.
        fieldName:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
    Address:
      title: Address
      type: object
      properties:
        city:
          type: string
          nullable: true
          x-nullable: true
        country:
          type: string
          nullable: true
          x-nullable: true
        number:
          type: integer
          format: int32
        postcode:
          type: string
          nullable: true
          x-nullable: true
        street:
          type: string
          nullable: true
          x-nullable: true
    Car:
      title: Car
      type: object
      properties:
        brand:
          type: string
          nullable: true
          x-nullable: true
        maxSpeedKmH:
          type: number
          format: float
          nullable: true
          x-nullable: true
        model:
          type: string
          nullable: true
          x-nullable: true
    ObjectIdReq:
      title: ObjectIdReq
      type: object
      properties:
        timestamp:
          type: integer
          format: int32
    ObjectIdRes:
      title: ObjectIdRes
      type: object
      properties:
        date:
          type: string
          format: date-time
        timestamp:
          type: integer
          format: int32
    PersonReq:
      title: PersonReq
      type: object
      properties:
        address:
          $ref: "#/components/schemas/Address"
        age:
          type: integer
          format: int32
        cars:
          type: array
          items:
            $ref: "#/components/schemas/Car"
        createdAt:
          type: string
          format: date-time
        firstName:
          type: string
        id:
          $ref: "#/components/schemas/ObjectIdReq"
        insurance:
          type: boolean
        lastName:
          type: string
    PersonRes:
      title: PersonRes
      type: object
      properties:
        address:
          $ref: "#/components/schemas/Address"
        age:
          type: integer
          format: int32
        cars:
          type: array
          items:
            $ref: "#/components/schemas/Car"
        createdAt:
          type: string
          format: date-time
        firstName:
          type: string
        id:
          type: string
        insurance:
          type: boolean
        lastName:
          type: string
