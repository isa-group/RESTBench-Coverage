  ProjectCommit:
    type: object
    properties:
      commitDate:
        type: string
        format: date-time
      commitEmpDesc:
        type: string
      commitMgrDesc:
        type: string
      employeeId:
        type: integer
        format: int32
      firstName:
        type: string
      lastName:
        type: string
      projectId:
        type: integer
        format: int32
    title: ProjectCommit
